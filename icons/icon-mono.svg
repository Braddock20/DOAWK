  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#g)" stroke-width="6" opacity="0.6"/>
  <!-- Journal pages -->
